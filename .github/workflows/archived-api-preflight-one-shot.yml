name: One-shot read-only DNS and archived API audit

on:
  push:
    branches:
      - ops/archived-api-preflight-2026-10-31

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Cross-check Supabase project DNS with independent public resolvers
        shell: bash
        run: |
          set -u
          host='cwxxhzfppvkuqvmmhgiq.supabase.co'
          for name in google.com supabase.co "$host"; do
            echo "DNS_LOCAL name=$name"
            getent ahostsv4 "$name" | head -n 1 || true
            for endpoint in 'https://dns.google/resolve' 'https://cloudflare-dns.com/dns-query'; do
              response=$(curl -sS --get --connect-timeout 10 --max-time 20 \
                -H 'accept: application/dns-json' \
                --data-urlencode "name=$name" \
                --data-urlencode 'type=A' "$endpoint" 2>&1)
              status=$?
              echo "DNS_DOH name=$name resolver=$endpoint curl_exit=$status body=$response"
            done
          done
          echo 'No API keys, cookies, user identifiers, participation data, or database requests used.'
