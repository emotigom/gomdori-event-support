name: One-shot security dependency refresh

on:
  push:
    branches:
      - security/remediate-npm-audit-2026-10-27

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'emotigom/nextbridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Refresh vulnerable dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact astro@7.4.2 zod@4.6.6
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --audit-level=high
      - name: Validate clean install and all quality gates
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          ASTRO_BASE_PATH: /nextbridge
          ASTRO_SITE_URL: https://emotigom.github.io
        run: |
          npm ci
          npm run verify
      - name: Remove one-shot workflow and commit only verified dependency fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-lockfile-refresh.yml
          git add package.json package-lock.json
          git diff --cached --stat
          git commit -m "security: upgrade audited dependencies and lockfile"
          git push origin HEAD:security/remediate-npm-audit-2026-10-27
